name: Controle Action
run-name: ${{ github.actor }} Esta testando
on: [push, pull_request]
jobs:
  Teste-Action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
